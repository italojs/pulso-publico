name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: legislativo_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U app -d legislativo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5435/legislativo_test
      TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5435/legislativo_test
      DEMO_TEST_DATABASE_URL: postgres://app:app@127.0.0.1:5435/legislativo_test_demo
      GEO_PROVIDER: none
      OPENAI_API_KEY: ""
      OPENAI_MODEL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.19.0
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Create isolated demo database
        env:
          PGPASSWORD: app
        run: psql -h 127.0.0.1 -p 5435 -U app -d legislativo_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE legislativo_test_demo'
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

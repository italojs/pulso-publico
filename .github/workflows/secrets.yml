name: Secrets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          task_dir="$(mktemp -d)"
          cd "$task_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          # Digest from the release's published checksums, reviewed at initial publication.
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          mkdir -p "$RUNNER_TEMP/pulso-gitleaks"
          mv gitleaks "$RUNNER_TEMP/pulso-gitleaks/gitleaks"
      - name: Scan history without exposing findings
        run: '"$RUNNER_TEMP/pulso-gitleaks/gitleaks" git . --log-opts="--all" --redact --no-banner'
      - name: Scan checked-out files without exposing findings
        run: '"$RUNNER_TEMP/pulso-gitleaks/gitleaks" dir . --redact --no-banner'
